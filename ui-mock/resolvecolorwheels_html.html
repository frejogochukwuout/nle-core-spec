<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primaries - Color Wheels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Colors and Utilities */
        :root {
            --bg-app: #18181a;
            --bg-panel: #232326;
            --bg-header: #1c1c1e;
            --border-dark: #111111;
            --text-label: #88888d;
            --text-value: #e0e0e0;
            --text-title: #ffffff;
        }

        body {
            background-color: var(--bg-app);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        /* Color Wheel Gradients */
        .wheel-gradient {
            background: 
                radial-gradient(circle at 50% 50%, #252528 40%, #252528bb 55%, transparent 75%, rgba(0,0,0,0.8) 100%),
                conic-gradient(from 0deg, #ff2a2a, #ff2aff, #2a2aff, #2affff, #2aff2a, #ffff2a, #ff2a2a);
            box-shadow: inset 0 0 12px rgba(0,0,0,1);
        }

        /* Input Styling */
        .val-input {
            background-color: #101012;
            border: 1px solid #111;
            color: var(--text-value);
            text-align: center;
            font-size: 11.5px;
            padding: 2px 0;
            outline: none;
            width: 38px;
            border-radius: 2px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
            transition: border-color 0.1s;
        }
        .val-input:focus {
            border-color: #555;
        }
        
        .val-input-lg {
            width: 48px;
        }

        /* The 3D Scroll Thumbwheels */
        .thumbwheel-track {
            height: 12px;
            width: 100%;
            background: linear-gradient(to bottom, #0a0a0c, #2a2a2e 40%, #0a0a0c);
            border-radius: 6px;
            border: 1px solid #000;
            position: relative;
            overflow: hidden;
            box-shadow: 0 1px 1px rgba(255,255,255,0.05);
            cursor: ew-resize;
        }
        .thumbwheel-track::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(to right, transparent, transparent 2px, rgba(0,0,0,0.6) 2px, rgba(0,0,0,0.6) 4px);
        }

        /* Custom mini slider tracks */
        .mini-slider {
            height: 4px;
            background-color: #111;
            border: 1px solid #222;
            border-radius: 2px;
            position: relative;
            margin-top: 4px;
            width: 100%;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
        }
        .mini-slider-thumb {
            position: absolute;
            height: 100%;
            background-color: #888;
            border-radius: 2px;
            top: 0;
            transform: translateX(-50%);
            width: 8px;
        }
        
        /* Bar Indicator specifically for bottom and top controls */
        .color-bar {
            height: 2px;
            width: 100%;
            margin-top: 4px;
            border-radius: 1px;
        }

        /* Tooltip Arrow */
        .tooltip-arrow::after {
            content: '';
            position: absolute;
            top: 100%;
            right: 15px;
            border-width: 5px;
            border-style: solid;
            border-color: #111 transparent transparent transparent;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
